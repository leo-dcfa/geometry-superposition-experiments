name: ci

# Rule R5: a fresh clone must be runnable and green. This job checks out the
# repo with nothing cached, syncs the locked environment, and runs the full
# test suite. It deliberately does NOT restore a venv or a package cache from
# a previous run — the point is to catch a source module that only exists on
# the developer's disk (the failure mode that blocked the parent program's
# 05b audit, where an unanchored `data/` in .gitignore swallowed a module).

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  fresh-clone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Verify no source module is gitignored
        run: uv run python tools/check_tracked_sources.py

      - name: Lint
        run: uv run ruff check csc tests experiments tools

      - name: Test
        run: uv run pytest -q
