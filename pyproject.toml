[project]
name = "csc"
version = "0.1.0"
description = "Curvature and Superposition Capacity — does negative curvature buy representational room?"
authors = [{ name = "Leo", email = "leo@azullabs.dev" }]
requires-python = ">=3.12"
dependencies = [
    "geoopt>=0.5.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pyyaml>=6.0.3",
    "scipy>=1.16.0",
    "torch>=2.13.0",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "hypothesis>=6.158.1",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]
